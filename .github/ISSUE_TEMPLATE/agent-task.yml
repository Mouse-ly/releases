name: Agent-ready task
description: Define a scoped implementation task for any authorized agent provider.
title: "[Linear ID] Outcome"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Linear remains canonical for implementation ownership and state. Do not include credentials or private evidence in this issue.
  - type: input
    id: linear_id
    attributes:
      label: Linear ID
      description: Existing canonical Linear issue identifier, such as MLY-123.
      placeholder: MLY-123
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Exact owner/repository target.
      value: "Mouse-ly/mousely-windows-app"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Observable end state, not implementation instructions.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions
      description: Explicitly out-of-scope behavior, files, systems, and one-way actions.
    validations:
      required: true
  - type: textarea
    id: acceptance_verifier
    attributes:
      label: Acceptance verifier
      description: Deterministic commands or observable checks that decide completion.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: Tests, screenshots, device/browser evidence, logs, or artifact links required for review.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Required capabilities
      description: Runtime, host, provider, device, authenticated session, services, and credential classes.
    validations:
      required: true
  - type: textarea
    id: human_gates
    attributes:
      label: Human gates
      description: Decisions or actions that require a named human immediately before execution.
    validations:
      required: true
